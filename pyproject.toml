[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name        = "trafix"
version     = "6.0.0"
description = "AI-powered adaptive traffic signal control using GRU + GAT + PPO"
readme      = "README.md"
requires-python = ">=3.9"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "torch>=2.2",
    "torch-geometric>=2.5",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
    "sumolib",
]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
    "pandas>=2.0",
]

[project.scripts]
trafix-serve    = "run:main"
trafix-train    = "scripts.train:main"
trafix-simulate = "scripts.simulate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "model*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
